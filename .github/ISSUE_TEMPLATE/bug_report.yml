name: Bug report
description: Something in ClaimDesk does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including error messages or status codes.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as adjuster@claimdesk.local
        2. Open claim ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Angular UI, Workflow / state machine, Evidence upload, SLA worker, Risk rules, Docker / setup, Other]
  - type: input
    id: version
    attributes:
      label: Commit or version
