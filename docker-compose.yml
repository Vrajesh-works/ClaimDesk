# One-command local stack: `docker compose up --build`, then open http://localhost:8080.
# Every Azure service from the roadmap has a local stand-in here (see docs/PLAN.md).
name: claimdesk

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ClaimDesk_Local_2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/ClaimDesk.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: SqlServer
      ConnectionStrings__ClaimDesk: "Server=sqlserver,1433;Database=ClaimDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ClaimDesk_Local_2026!};TrustServerCertificate=True"
      # Local-only secrets. In Azure these come from Key Vault.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-compose-jwt-signing-key-0123456789abcdef}
      EvidenceStorage__SigningKey: ${EVIDENCE_SIGNING_KEY:-local-compose-evidence-link-key-0123456789abcdef}
      Seed__Enabled: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:-ClaimDesk!2026}
      Sla__ScanInterval: "00:01:00"
      RateLimiting__LoginPermitsPerMinute: ${LOGIN_PERMITS_PER_MINUTE:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: claimdesk-api
    volumes:
      - evidence:/app/data/evidence
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q Healthy <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

volumes:
  sqldata:
  evidence:
